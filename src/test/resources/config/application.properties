# Test-only overrides, layered over src/main/resources/application.yaml.
# Every test calls from localhost, so the per-address sign-in cap would trip on the
# suite itself; the cap is covered by AuthRateLimitFilterTest.
pegasus.auth.rate-limit-per-minute=1000000
# Shared localhost traffic in integration tests; actual limits have dedicated tests.
pegasus.api.rate-limit-per-minute=1000000
