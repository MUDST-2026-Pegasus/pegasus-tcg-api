spring:
  application:
    name: pegasus-api

  config:
    import: optional:file:${APP_ENV_FILE:.env}[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pegasus_tcg}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Keep in step with the flyway block in build.gradle.
    out-of-order: true
    validate-migration-naming: true

  jooq:
    sql-dialect: postgres

# Local/default output stays readable. Deploy profiles select Logstash JSON,
# while LOG_FORMAT can explicitly select (or disable with an empty value) it.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n%wEx"
  structured:
    format:
      console: ${LOG_FORMAT:}
    json:
      add:
        service: ${spring.application.name}
        env: ${APP_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  opentelemetry:
    resource-attributes:
      service.name: pegasus-api
      deployment.environment: ${APP_ENV:local}
      service.version: ${APP_VERSION:dev}
    tracing:
      export:
        otlp:
          # Spring Boot 4 uses this property path for OTLP trace export.
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        enabled: ${OTLP_METRICS_ENABLED:true}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

pegasus:
  auth:
    # No default: the app refuses to start without a real key.
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: pegasus-tcg-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    refresh-cookie:
      name: pegasus_rt
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
      # Lax for same-site deploys; None when the web runs on another site (workers.dev previews).
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}
    password-reset-ttl: 1h
    max-failed-logins: 5
    lockout-duration: 15m
    # Returns password reset tokens in API responses. Local development only.
    dev-expose-tokens: ${AUTH_DEV_EXPOSE_TOKENS:false}
    # Tries a minute per client address on login, register, password reset and
    # password change, whichever account they name. The per-account lockout above
    # does not stop one password being tried against many accounts.
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:30}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # Wildcard hosts, e.g. https://*.pegasus-dev-teams.workers.dev for Worker previews.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

  cart:
    # Signed-out baskets past their expires_at. Anyone can create one without an
    # account, so something has to clear them out.
    guest-purge-cron: ${CART_GUEST_PURGE_CRON:0 30 3 * * *}

  promo:
    # Tries a minute per client address and per account on the endpoints that say
    # whether a typed discount code exists (promo-preview, claim-by-code, terms).
    rate-limit-per-minute: ${PROMO_RATE_LIMIT_PER_MINUTE:30}

  sale:
    # Works out every listing's sale price again, so sales start and end on time [TCG-676].
    refresh-cron: ${SALE_REFRESH_CRON:0 * * * * *}

  order:
    # Escrow auto-release sweep: completes sub-orders the buyer never confirmed.
    auto-release-cron: ${ORDER_AUTO_RELEASE_CRON:0 */5 * * * *}
    # How many overdue sub-orders one round of the sweep pulls in.
    auto-release-batch-size: ${ORDER_AUTO_RELEASE_BATCH_SIZE:200}

  payment:
    # POST /orders/{id}/pay marks an order paid without taking any money, which is
    # only ever wanted on a developer machine or a sandbox. Off unless asked for:
    # on a live deployment it is a way to have cards posted for free.
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}

  pricing:
    # The nightly market run: the day's median per printing and condition, then
    # AUTO_MEDIAN prices moved to it [RQ-5]. Safe to run twice, or on two instances.
    market-job-cron: ${PRICING_MARKET_JOB_CRON:0 0 3 * * *}
    # 03:00 above, and the date a day's statistics belong to, are Thai time.
    zone: Asia/Bangkok

  storage:
    # Where the app reaches MinIO. Inside a container this is http://minio:9000.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Where the browser reaches it. Presigned URLs are signed for this host, so
    # signing with the internal name would hand the browser a URL it cannot open.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    # No default, as with jwt-secret: a missing key stops the app instead of falling
    # back to MinIO's well-known minioadmin login.
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:pegasus}
    # Long enough to pick a file and upload it, short enough that a leaked link is worthless.
    upload-url-ttl: 5m
    download-url-ttl: 15m
    # When the bucket lets anyone read catalog/ and seed/, those keys go out as plain
    # URLs instead of signed ones. A signed URL changes on every call, so neither the
    # browser nor the CDN in front of MinIO can cache it. Turn this on only after the
    # bucket policy is in place, or every catalogue picture answers 403.
    public-read: ${MINIO_PUBLIC_READ:false}

springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
