spring:
  application:
    name: pegasus-tcg-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pegasus_tcg}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jooq:
    sql-dialect: postgres

pegasus:
  auth:
    # No default: the app refuses to start without a real key.
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: pegasus-tcg-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    password-reset-ttl: 1h
    max-failed-logins: 5
    lockout-duration: 15m
    # Returns password reset tokens in API responses. Local development only.
    dev-expose-tokens: ${AUTH_DEV_EXPOSE_TOKENS:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
