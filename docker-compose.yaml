services:
  postgres:
    image: postgres:17-alpine
    container_name: pegasus-tcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pegasus_tcg}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pegasus_tcg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # Official MinIO images on quay.io and Docker Hub no longer allow anonymous pulls;
    # pgsty/minio is a maintained drop-in fork (same entrypoint, ships mc).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: pegasus-tcg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # No fallback: without these MinIO would start with the public minioadmin login.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      # The browser PUTs straight to MinIO with a presigned URL, so the S3 port
      # has to accept cross-origin requests from the web client.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      # 9000 is the S3 API the app and the browser talk to; 9001 is the web console.
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pegasus-tcg-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pegasus_tcg}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - AUTH_DEV_EXPOSE_TOKENS=${AUTH_DEV_EXPOSE_TOKENS:-false}
      - PAYMENT_MOCK_ENABLED=${PAYMENT_MOCK_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  miniodata:
