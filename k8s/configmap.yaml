apiVersion: v1
kind: ConfigMap
metadata:
  name: pegasus-backend-config
  labels:
    app: pegasus-backend
    app.kubernetes.io/name: pegasus-tcg-api
    app.kubernetes.io/instance: pegasus-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pegasus-tcg
# ค่าที่ไม่เป็นความลับเท่านั้น รหัสผ่านและ key อยู่ใน Secret pegasus-backend-secret
# แก้ค่าในนี้แล้ว Pod เดิมจะยังไม่เห็น ต้องสั่ง kubectl rollout restart ตาม
data:
  # ชื่อ Service ของ Postgres ภายในคลัสเตอร์ (ดู k8s/dependencies/postgres.yaml)
  DB_URL: jdbc:postgresql://pegasus-postgres-service:5432/pegasus_tcg

  # endpoint ที่ backend ใช้คุยกับ MinIO ภายในคลัสเตอร์
  MINIO_ENDPOINT: http://pegasus-minio-service:9000
  # endpoint ที่ browser ใช้ presigned URL ถูก sign ด้วย host นี้
  # ค่านี้ตรงกับ kubectl port-forward service/pegasus-minio-service 9000:9000
  MINIO_PUBLIC_ENDPOINT: http://localhost:9000
  MINIO_BUCKET: pegasus

  # origin ของ frontend ที่ port-forward ไว้ที่ 8081 (คั่นด้วย , ถ้ามีหลายค่า)
  CORS_ALLOWED_ORIGINS: http://localhost:8081

  # ค่า default ของแอปคือ true ซึ่งทำให้กดจ่ายเงินได้โดยไม่ตัดเงินจริง จึงปิดไว้ชัดเจน
  PAYMENT_MOCK_ENABLED: "false"
  AUTH_DEV_EXPOSE_TOKENS: "false"

  # เชื่อ X-Forwarded-* จาก Ingress เพื่อให้ redirect และ Swagger UI ใช้ prefix ของ Ingress
  SERVER_FORWARD_HEADERS_STRATEGY: framework

  # เปิด /actuator/health/liveness และ /actuator/health/readiness ให้ probe เรียก
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # รอ request ที่ค้างอยู่ให้จบก่อนปิด ต้องสั้นกว่า terminationGracePeriodSeconds
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
