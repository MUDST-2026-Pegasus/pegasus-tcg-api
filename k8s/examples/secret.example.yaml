# ตัวอย่างเท่านั้น ห้าม apply ไฟล์นี้ตรงๆ
# คัดลอกไปเป็น k8s/secret.yaml (อยู่ใน .gitignore แล้ว) ใส่ค่าจริง แล้วค่อย apply
apiVersion: v1
kind: Secret
metadata:
  name: pegasus-backend-secret
  labels:
    app: pegasus-backend
    app.kubernetes.io/name: pegasus-tcg-api
    app.kubernetes.io/instance: pegasus-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pegasus-tcg
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: change-me
  # สร้างด้วย: openssl rand -base64 48
  JWT_SECRET: replace-with-a-random-48-byte-base64-string
  # MinIO บังคับ access key อย่างน้อย 3 ตัวอักษร และ secret key อย่างน้อย 8 ตัวอักษร
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: change-me
