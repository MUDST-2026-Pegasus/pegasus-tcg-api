# ตัวอย่างเท่านั้น ห้าม apply ไฟล์นี้ตรงๆ
# คัดลอกไปเป็น k8s/secret.yaml (อยู่ใน .gitignore แล้ว) ใส่ค่าจริง แล้วค่อย apply
apiVersion: v1
kind: Secret
metadata:
  name: pegasus-backend-secret
  labels:
    app: pegasus-backend
    app.kubernetes.io/name: pegasus-tcg-api
    app.kubernetes.io/instance: pegasus-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: pegasus-tcg
type: Opaque
stringData:
  # Postgres และ MinIO รันนอกคลัสเตอร์ด้วย docker compose
  # host.docker.internal คือชื่อที่ Pod ใช้เรียกเครื่องที่รัน Docker Desktop

  # พอร์ตต้องตรงกับ DB_PORT และ user/รหัสผ่านต้องตรงกับ POSTGRES_USER/POSTGRES_PASSWORD ใน .env
  DB_URL: jdbc:postgresql://host.docker.internal:5432/pegasus_tcg
  DB_USERNAME: postgres
  DB_PASSWORD: change-me

  # สร้างด้วย: openssl rand -base64 48
  JWT_SECRET: replace-with-a-random-48-byte-base64-string

  # พอร์ตต้องตรงกับ MINIO_PORT และ key ต้องตรงกับ MINIO_ACCESS_KEY/MINIO_SECRET_KEY ใน .env
  MINIO_ENDPOINT: http://host.docker.internal:9000
  # URL รูปที่ส่งให้ browser ถูก sign ด้วย host นี้ และ backend ต้องต่อ host นี้ได้เองตอน sign
  # จึงต้องเป็นชื่อที่ทั้ง Pod และ browser เรียกถึง MinIO ได้ ใช้ localhost ไม่ได้เพราะใน Pod หมายถึงตัว Pod เอง
  # kubernetes.docker.internal ชี้มาที่เครื่องนี้ทั้งจากใน Pod และจาก browser (Docker Desktop ใส่ไว้ในไฟล์ hosts เป็น 127.0.0.1)
  MINIO_PUBLIC_ENDPOINT: http://kubernetes.docker.internal:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: change-me
