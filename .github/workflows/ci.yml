name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/pegasus_tcg
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      # Dedicated CI credentials; never use production credentials.
      MINIO_ACCESS_KEY: ${{ secrets.CI_MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.CI_MINIO_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Generate test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Start test services
        run: |
          : "${DB_PASSWORD:?Set the CI_DB_PASSWORD repository secret}"
          : "${MINIO_ACCESS_KEY:?Set the CI_MINIO_ACCESS_KEY repository secret}"
          : "${MINIO_SECRET_KEY:?Set the CI_MINIO_SECRET_KEY repository secret}"
          docker compose up -d --wait postgres minio

      - name: Test and build
        run: ./gradlew build --no-daemon

      - name: Upload application JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" --redact --verbose --exit-code=1 \
            --report-format=json --report-path=/reports/gitleaks.json

      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/gitleaks.json
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    secrets:
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

  publish:
    name: Publish API image
    needs: [quality, secrets, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tested JAR
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: image

      - name: Prepare image context
        run: |
          mv image/*-SNAPSHOT.jar image/app.jar
          cp Dockerfile.ci image/Dockerfile
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: image
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
