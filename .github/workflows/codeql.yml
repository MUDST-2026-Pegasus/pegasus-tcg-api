name: "CodeQL"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CI_DB_PASSWORD:
        required: true
  schedule:
    - cron: "0 3 * * 1,4"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      DB_URL: jdbc:postgresql://localhost:5432/pegasus_tcg
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pegasus_tcg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pegasus_tcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build for analysis
        run: ./gradlew build -x test --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: failure-only

      - name: Locate SARIF file
        id: locate-sarif
        run: |
          SARIF_FILE=$(ls sarif-results/*.sarif 2>/dev/null | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "Error: No SARIF file found in sarif-results/"
            exit 1
          fi
          echo "sarif_file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
          echo "Located SARIF file: $SARIF_FILE"

      - name: Filter generated sources from SARIF
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            +**/*
            -build/**
            -build/generated-src/**
            -**/build/**
            -**/generated-src/**
          input: ${{ steps.locate-sarif.outputs.sarif_file }}
          output: ${{ steps.locate-sarif.outputs.sarif_file }}

      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.locate-sarif.outputs.sarif_file }}
          category: "/language:${{ matrix.language }}"
