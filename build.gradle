buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Flyway resolves database modules from its own classloader, so the
        // Postgres support has to sit on the buildscript classpath.
        classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
        classpath 'org.postgresql:postgresql:42.7.13'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '12.4.0'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.7'
}

group = 'com.pegasus'
version = '0.0.1-SNAPSHOT'
description = 'pegasus-tcg-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'

    // OpenAPI 3 / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    jooqCodegen 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Resolve DB settings the same way the app does: real env var first, then .env, then default.
def dotenv = new Properties()
if (file('.env').exists()) {
    file('.env').withInputStream { dotenv.load(it) }
}
def dbSetting = { String key, String fallback ->
    System.getenv(key) ?: dotenv.getProperty(key) ?: fallback
}

def dbUrl = dbSetting('DB_URL', 'jdbc:postgresql://localhost:5432/pegasus_tcg')
def dbUser = dbSetting('DB_USERNAME', 'postgres')
def dbPassword = dbSetting('DB_PASSWORD', 'postgres')

flyway {
    cleanDisabled = false
    url = dbUrl
    user = dbUser
    password = dbPassword
    locations = ['filesystem:src/main/resources/db/migration']
    baselineOnMigrate = true
    outOfOrder = true
    validateMigrationNaming = true
}

jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = dbUrl
            user = dbUser
            password = dbPassword
        }
        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                excludes = 'flyway_schema_history'

                forcedTypes {
                    forcedType {
                        userType = 'com.pegasus.pegasustcgapi.model.UserStatus'
                        enumConverter = true
                        includeTypes = 'user_status'
                    }
                    forcedType {
                        userType = 'com.pegasus.pegasustcgapi.model.TokenPurpose'
                        enumConverter = true
                        includeTypes = 'token_purpose'
                    }
                }
            }
            generate {
                javaTimeTypes = true
            }
            target {
                packageName = 'com.pegasus.pegasustcgapi.jooq'
                directory = 'build/generated-src/jooq'
            }
        }
    }
}

sourceSets.main.java.srcDir 'build/generated-src/jooq'

// Schema in the DB is what jOOQ reads, so migrate before generating.
tasks.named('jooqCodegen') {
    dependsOn tasks.named('flywayMigrate')
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('test') {
    useJUnitPlatform()
}
