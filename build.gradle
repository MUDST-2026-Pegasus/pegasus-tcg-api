buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Flyway resolves database modules from its own classloader, so the
        // Postgres support has to sit on the buildscript classpath.
        classpath 'org.flywaydb:flyway-database-postgresql:13.12.1'
        classpath 'org.postgresql:postgresql:42.7.14'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '13.12.1'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.9'
    id 'jacoco'
}

group = 'com.pegasus'
version = '0.0.1-SNAPSHOT'
description = 'pegasus-tcg-api'
ext.license = 'Apache-2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Spring Boot 4 renamed the AOP starter to AspectJ.
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // Spring Boot 4 auto-instruments JDBC with Micrometer observations and spans.
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.3.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    // Generates the signed-in user's order-summary PDF without a web-rendering runtime.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    // Object storage. Talks S3 to MinIO in compose.yaml.
    implementation 'io.minio:minio:9.0.4'

    // OpenAPI 3 / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    jooqCodegen 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // A throwaway Postgres for tests that need real concurrent sessions, and that
    // must not reprice anybody's development data. Needs Docker, like compose.yaml.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // Acceptance tests: the Gherkin features under src/test/resources/features, run
    // through the JUnit Platform suite in acceptance/CucumberTestRunner.
    testImplementation platform('io.cucumber:cucumber-bom:8.0.4')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    // TCG-755: validates real responses against the published /v1/api-docs. Pinned on purpose.
    testImplementation 'com.atlassian.oai:swagger-request-validator-core:2.44.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// TCG-755: swagger-request-validator brings the javax swagger-core 2.2.x, whose classes share
// packages with springdoc's swagger-*-jakarta and shadow them (/v1/api-docs then fails with
// NoSuchMethodError). On the test classpath, use the jakarta artifacts springdoc already ships.
configurations.matching { it.name.startsWith('test') }.configureEach {
    resolutionStrategy.dependencySubstitution {
        ['swagger-annotations', 'swagger-models', 'swagger-core'].each { name ->
            substitute module("io.swagger.core.v3:${name}") using module("io.swagger.core.v3:${name}-jakarta:2.2.55") because 'TCG-755: keep springdoc\'s jakarta swagger on the test classpath'
        }
    }
}

// Resolve DB settings the same way the app does: real env var, selected file, then default.
def dotenv = new Properties()
def envFile = file(System.getenv('APP_ENV_FILE') ?: '.env')
if (envFile.exists()) {
    envFile.withInputStream { dotenv.load(it) }
}
def dbSetting = { String key, String fallback ->
    System.getenv(key) ?: dotenv.getProperty(key) ?: fallback
}

def dbUrl = dbSetting('DB_URL', 'jdbc:postgresql://localhost:5432/pegasus_tcg')
def dbUser = dbSetting('DB_USERNAME', 'postgres')
def dbPassword = dbSetting('DB_PASSWORD', 'postgres')

flyway {
    cleanDisabled = false
    url = dbUrl
    user = dbUser
    password = dbPassword
    locations = ['filesystem:src/main/resources/db/migration']
    baselineOnMigrate = true
    outOfOrder = true
    validateMigrationNaming = true
}

jooq {
    configuration {
        jdbc {
            driver = 'org.postgresql.Driver'
            url = dbUrl
            user = dbUser
            password = dbPassword
        }
        generator {
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                excludes = 'flyway_schema_history'

                forcedTypes {
                    forcedType {
                        userType = 'com.pegasus.pegasustcgapi.model.user.UserStatus'
                        enumConverter = true
                        includeTypes = 'user_status'
                    }
                    forcedType {
                        userType = 'com.pegasus.pegasustcgapi.model.auth.TokenPurpose'
                        enumConverter = true
                        includeTypes = 'token_purpose'
                    }
                }
            }
            generate {
                javaTimeTypes = true
                generatedAnnotation = true
                generatedAnnotationType = 'DETECT_FROM_JDK'
            }
            target {
                packageName = 'com.pegasus.pegasustcgapi.jooq'
                directory = 'build/generated-src/jooq'
            }
        }
    }
}

sourceSets.main.java.srcDir 'build/generated-src/jooq'

// Schema in the DB is what jOOQ reads, so migrate before generating.
tasks.named('jooqCodegen') {
    dependsOn tasks.named('flywayMigrate')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('test') {
    // TCG-755: tests that pin an open product defect fail on purpose; they run in crossModuleTest.
    useJUnitPlatform { excludeTags 'known-defect' }
    systemProperty 'file.encoding', 'UTF-8'
    // CI gates must represent an executed suite, not a cached result.
    outputs.cacheIf { !System.getenv('CI') }
    outputs.upToDateWhen { !System.getenv('CI') }
    finalizedBy tasks.named('jacocoTestReport')
}

// TCG-755: FE/BE contract and cross-module journeys only, against Testcontainers Postgres
// (and MinIO). Same JVM settings as `test`; these classes also run inside `test`.
tasks.register('crossModuleTest', Test) {
    description = 'Runs the @Tag("cross-module") contract and journey integration tests (TCG-755)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeEngines 'junit-jupiter'; includeTags 'cross-module' }
    systemProperty 'file.encoding', 'UTF-8'
    outputs.upToDateWhen { false }
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/pegasus/pegasustcgapi/jooq/**',
                'com/pegasus/pegasustcgapi/PegasusTcgApiApplication.class'
            ])
        }))
    }
}

// ErrorCode → build/i18n/errors/en.json สำหรับ Tolgee namespace `errors` (CI push เข้า Tolgee) [TCG-548]
tasks.register('exportErrorCatalog', JavaExec) {
    group = 'i18n'
    description = 'Writes every ErrorCode and its default message to build/i18n/errors/en.json'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pegasus.pegasustcgapi.exception.ErrorCatalog'
    args layout.buildDirectory.file('i18n/errors/en.json').get().asFile.path
    outputs.file(layout.buildDirectory.file('i18n/errors/en.json'))
}
